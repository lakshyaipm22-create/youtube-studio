name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libcairo2-dev \
            libpango1.0-dev \
            pkg-config \
            python3-dev

      - name: Install project
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate installation
        run: |
          python -c "import studio; print('studio package OK')"
          python -c "import pipeline; print('pipeline package OK')"
          python -c "from studio.styles import BRAND_PRIMARY; print(f'styles loaded: {BRAND_PRIMARY}')"

      - name: Lint with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            pytest tests/ -v
          else
            echo "No tests/ directory found. Skipping."
          fi
