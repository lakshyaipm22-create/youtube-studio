total_duration: 143.06
scenes:
- name: Intro
  start: 0.0
  end: 12.8
  duration: 12.8
  sentences:
  - text: A Boeing 747 weighs 400 tons.
    start: 0.0
    end: 3.24
    duration: 3.24
  - text: That is 80 elephants.
    start: 3.62
    end: 4.74
    duration: 1.12
  - text: And somehow, it flies.
    start: 5.1
    end: 6.66
    duration: 1.56
  - text: Right now there are about 10,000 planes in the sky.
    start: 7.14
    end: 9.56
    duration: 2.42
  - text: Not one of them should be there.
    start: 9.92
    end: 11.14
    duration: 1.22
  - text: So what is actually holding them up?
    start: 11.36
    end: 12.8
    duration: 1.44
- name: WindAndWing
  start: 13.02
  end: 31.8
  duration: 18.78
  sentences:
  - text: You probably learned this in school.
    start: 13.02
    end: 14.46
    duration: 1.44
  - text: The wing is curved on top, so air travels a longer path, moves faster, creates
      low
    start: 14.94
    end: 19.36
    duration: 4.42
  - text: pressure and the plane gets sucked upward.
    start: 19.36
    end: 21.18
    duration: 1.82
  - text: Sounds clean.
    start: 21.66
    end: 22.4
    duration: 0.74
  - text: One problem, if that were the whole story, planes could never fly upside
      down.
    start: 22.76
    end: 26.86
    duration: 4.1
  - text: But they can.
    start: 27.48
    end: 28.24
    duration: 0.76
  - text: Stunt pilots do it all the time.
    start: 28.24
    end: 30.2
    duration: 1.96
  - text: So what is actually going on?
    start: 30.5
    end: 31.8
    duration: 1.3
- name: TheRealExplanationPart1
  start: 32.02
  end: 49.74
  duration: 17.72
  sentences:
  - text: Start with something you have done 100 times.
    start: 32.02
    end: 33.88
    duration: 1.86
  - text: Hand out the car window.
    start: 34.28
    end: 35.18
    duration: 0.9
  - text: Flat, nothing happens.
    start: 35.56
    end: 36.92
    duration: 1.36
  - text: Tilt it up just a little, you feel a force pushing your hand up.
    start: 37.2
    end: 39.94
    duration: 2.74
  - text: That is lift.
    start: 40.16
    end: 40.82
    duration: 0.66
  - text: And it is the exact same physics keeping a 747 in the air.
    start: 41.22
    end: 45.0
    duration: 3.78
  - text: A wing is just a fancy version of your tilted hand.
    start: 45.5
    end: 48.14
    duration: 2.64
  - text: It deflects air downward.
    start: 48.5
    end: 49.74
    duration: 1.24
- name: LiftExplained
  start: 50.38
  end: 63.9
  duration: 13.52
  sentences:
  - text: Newton's third law, every action has an equal and opposite reaction.
    start: 50.38
    end: 54.14
    duration: 3.76
  - text: Wing pushes air down, air pushes wing up.
    start: 54.98
    end: 57.44
    duration: 2.46
  - text: That upward push is lift.
    start: 57.44
    end: 59.12
    duration: 1.68
  - text: Simple, brutal, effective.
    start: 59.38
    end: 61.16
    duration: 1.78
  - text: But here is the thing, Newton is only half the answer.
    start: 61.48
    end: 63.9
    duration: 2.42
- name: BernoulliJoins
  start: 64.44
  end: 83.28
  duration: 18.84
  sentences:
  - text: The curved shape of the wing does something clever.
    start: 64.44
    end: 66.36
    duration: 1.92
  - text: Air flowing over the top speeds up and spreads out.
    start: 66.74
    end: 69.2
    duration: 2.46
  - text: Faster flow means lower pressure.
    start: 69.66
    end: 71.28
    duration: 1.62
  - text: That is Bernoulli's principle.
    start: 71.54
    end: 72.92
    duration: 1.38
  - text: So you get lower pressure above the wing and higher pressure below.
    start: 73.24
    end: 76.22
    duration: 2.98
  - text: The wing gets pushed upward by this pressure difference too.
    start: 76.66
    end: 79.36
    duration: 2.7
  - text: The real answer, it is not Newton or Bernoulli.
    start: 79.78
    end: 82.24
    duration: 2.46
  - text: It is both.
    start: 82.68
    end: 83.28
    duration: 0.6
- name: MythBust
  start: 84.12
  end: 103.64
  duration: 19.52
  sentences:
  - text: Together, always, remember that textbook explanation?
    start: 84.12
    end: 86.96
    duration: 2.84
  - text: It relies on air splitting at the front and meeting at the back at the same
      time.
    start: 86.96
    end: 90.86
    duration: 3.9
  - text: But wind tunnel experiments show that never happens.
    start: 91.34
    end: 93.8
    duration: 2.46
  - text: The air on top arrives first, every time.
    start: 94.3
    end: 96.88
    duration: 2.58
  - text: NASA calls this the equal transit time fallacy.
    start: 97.32
    end: 99.84
    duration: 2.52
  - text: Your textbook was wrong.
    start: 100.32
    end: 101.44
    duration: 1.12
  - text: You can officially feel smug about that.
    start: 101.76
    end: 103.64
    duration: 1.88
- name: TheSecretVariable
  start: 103.92
  end: 119.52
  duration: 15.6
  sentences:
  - text: But here is what pilots actually care about.
    start: 103.92
    end: 106.04
    duration: 2.12
  - text: Angle of attack.
    start: 106.26
    end: 107.12
    duration: 0.86
  - text: Tilt the wing up more, more lift.
    start: 107.48
    end: 109.04
    duration: 1.56
  - text: Tilt too far.
    start: 109.44
    end: 110.26
    duration: 0.82
  - text: The air cannot follow the curve anymore.
    start: 111.06
    end: 112.76
    duration: 1.7
  - text: It separates.
    start: 113.14
    end: 113.84
    duration: 0.7
  - text: Lift disappears.
    start: 114.3
    end: 115.12
    duration: 0.82
  - text: That is a stall.
    start: 115.52
    end: 116.26
    duration: 0.74
  - text: And that is the real danger not falling because gravity wins,
    start: 116.26
    end: 119.52
    duration: 3.26
- name: Outro
  start: 119.72
  end: 143.06
  duration: 23.34
  sentences:
  - text: but falling because you asked the wing to do too much.
    start: 119.72
    end: 122.06
    duration: 2.34
  - text: So next time you look up at a 400 ton metal tube cruising overhead, remember,
    start: 122.6
    end: 126.46
    duration: 3.86
  - text: it is not magic and it is not just one equation.
    start: 126.8
    end: 129.18
    duration: 2.38
  - text: It is Newton and Bernoulli working together, shoving air down so the plane
      goes up.
    start: 129.7
    end: 134.08
    duration: 4.38
  - text: If this finally made flight click for you, hit subscribe.
    start: 134.56
    end: 137.46
    duration: 2.9
  - text: Next time we are tackling another impossible question.
    start: 138.34
    end: 140.92
    duration: 2.58
  - text: Why do massive steel ships float?
    start: 141.36
    end: 143.06
    duration: 1.7
