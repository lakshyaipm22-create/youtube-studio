[project]
name = "youtube-studio"
version = "1.0.0"
description = "YouTube video production system using Manim and AI"
requires-python = ">=3.10"

dependencies = [
    "manim>=0.18.0",
    "kokoro>=0.9",
    "faster-whisper>=1.0.0",
    "pydub>=0.25.1",
    "edge-tts>=6.1.0",
    "Pillow>=10.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ipython",
    "ruff>=0.5.0",
    "pytest>=8.0.0",
]
ai = [
    "openai>=1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["studio*", "pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["F403", "F405"]

[tool.ruff.lint.per-file-ignores]
"studio/__init__.py" = ["F401"]
"videos/**/*.py" = ["F403", "F405"]
