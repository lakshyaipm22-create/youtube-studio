[project]
name = "youtube-studio"
version = "1.0.0"
description = "YouTube video production system using Manim and AI"
requires-python = ">=3.10"

dependencies = [
    "manim>=0.18.0",
    "kokoro>=0.9",
    "faster-whisper>=1.0.0",
    "pydub>=0.25.1",
    "edge-tts>=6.1.0",
    "Pillow>=10.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ipython",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["studio*", "pipeline*"]
